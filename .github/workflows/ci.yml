name: CI

on:
  push:
    branches: [main, integration/ai-chat-on-main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint with ruff
        run: |
          pip install ruff==0.9.10
          ruff check src tests

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  audit:
    # Known vulnerabilities in the pinned dependencies (PyPI advisory
    # database). Fails on any finding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned dependencies
        # The runner's Python ships its own pip and setuptools, which the
        # audit also sees; bring them current so only our pins are judged.
        run: |
          pip install --upgrade pip setuptools
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit==2.10.1
      - name: Audit them
        run: pip-audit --progress-spinner off

  sandbox:
    # The AI Studio's security is the image (non-root USER, rlimits, seccomp
    # on Linux x86_64), so the isolation tests are run inside the image the
    # deploy would ship, by the same script the deploy guide requires.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image with R and run the sandbox checks inside it
        run: scripts/check_image.sh lipidcruncher-ci-sandbox

  image:
    # The deployed image: builds as production does, then the app must answer
    # the load balancer's health check while running as a non-root user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t lipidcruncher-ci .

      - name: The image runs as a non-root user
        run: |
          user=$(docker image inspect -f '{{.Config.User}}' lipidcruncher-ci)
          echo "image user: ${user:-root}"
          case "$user" in ''|root|0|0:*) exit 1 ;; esac

      - name: The app answers /healthz as that user
        run: |
          docker run -d --name app -p 8501:8501 lipidcruncher-ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8501/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8501/healthz || { docker logs app; exit 1; }
          uid=$(docker exec app stat -c %u /proc/1)
          echo "app uid: $uid"
          test "$uid" != 0
