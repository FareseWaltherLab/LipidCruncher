[pytest]
pythonpath = src scripts
testpaths = tests

# The eval suite hits the real Anthropic API and is non-deterministic, so it
# is excluded from the default run. Invoke it deliberately:
#   pytest tests/evals/test_eval_suite.py -m eval
markers =
    eval: AI Studio eval suite; costs API calls, run on prompt/model changes
addopts = -m "not eval"

# pandas 1.5.3 calls a numpy function that numpy 1.26 deprecates; it fires
# inside pandas on most frame operations (thousands per run) and is not ours.
filterwarnings =
    ignore:np.find_common_type is deprecated:DeprecationWarning
